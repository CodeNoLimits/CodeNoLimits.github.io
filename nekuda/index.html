oogle Search"},"v":{"he":"מועמד ראשון לממומן: שאילתות רכישה מדויקות לספר, מהדורה וסט אמיתיים. להפריד מותג מרכישה. אין קהלים שהמפרסם יצר בקטגוריות דת רגישות. [8]","fr":"Premier candidat payant : requêtes d’achat exactes/expression pour vrais livres, éditions et coffrets. Séparer la marque. Pas d’audiences « religion » constituées par l’annonceur. [8]","en":"First paid candidate: exact/expression purchase queries for real books, editions and sets. Separate brand from acquisition. Avoid advertiser-curated audiences for sensitive religious categories. [8]"}},{"k":{"he":"אינסטגרם ופייסבוק","fr":"Instagram + Facebook","en":"Instagram + Facebook"},"v":{"he":"הדגמות מוצר אורגניות; בדיקה ממומנת רק לאחר בחינת יצירות ומקור נתונים. אין הסקת דת או ניסוח שקובע מהי דת הצופה. מטא מזהה דת כקטגוריית מקור נתונים. [9,10]","fr":"Démonstrations organiques ; test payant seulement après revue créa et source de données. Pas de ciblage religieux inféré. Meta classe la religion comme catégorie de source. [9,10]","en":"Organic product demonstrations; a paid test only after creative and data-source review. No inferred religious targeting or copy asserting the viewer’s religion. Meta identifies religion as a data-source category. [9,10]"}},{"k":{"he":"טיקטוק","fr":"TikTok","en":"TikTok"},"v":{"he":"חשיפה אורגנית: פרטי ספר, אריזה וקריאה קצרה עם מקור. לא מובטח פרסום דתי ממומן: הנחיה רשמית מונה אותו כאסור, והקישורים למדיניות אינם אחידים. לבדוק זכאות לפני הוצאה עתידית. [11]","fr":"Découverte organique. Aucune campagne payante « contenu religieux » n’est promise : le guide officiel la liste comme non autorisée ; les pages liées ne sont pas totalement cohérentes. Vérifier l’éligibilité avant tout spend. [11]","en":"Organic discovery: book details, packing and short accurately sourced readings. No paid religious-content campaign is promised: official guidance lists religious ads as not permitted; linked policy pages are not fully consistent. Verify eligibility before any future spend. [11]"}},{"k":{"he":"גוגל אורגני ומפות","fr":"Google organique / Maps","en":"Google organic / Maps"},"v":{"he":"שיפור מוצרים ופרטי חנות. רישומי מוצר ללא עלות מדיה — מועמד בכפוף לאישור; אין הבטחת מיקום. [16]","fr":"Améliorer fiches et infos magasin. Free listings possibles sous conditions ; aucun placement garanti. [16]","en":"Improve products and local store information. Free product listings are a candidate, subject to approval; no guaranteed placement. [16]"}},{"k":{"he":"וואטסאפ ודוא״ל","fr":"WhatsApp / e-mail","en":"WhatsApp / email"},"v":{"he":"מענה לפניות והודעות בהסכמה. אין איסוף אנשי קשר או פניות המוניות שלא התבקשו.","fr":"Répondre à l’entrant et messages permission-based. Pas de fichiers scrapés ni de prospection de masse.","en":"Answer inbound questions and use permission-based customer messages. No scraped contacts or bulk unsolicited outreach."}}],"note":{"he":"מקדמים את הספרים האמיתיים ואת תוכנם. אין להבטיח תוצאות רפואיות, כספיות או על־טבעיות כהבטחה מסחרית. לא מסתירים את אופי המוצר ולא משנים מעקב כדי לעקוף מגבלות פלטפורמה.","fr":"Promouvoir les vrais livres et leur contenu. Ne pas promettre de résultats médicaux, financiers ou surnaturels comme garantie commerciale. Ne jamais masquer le caractère religieux ni contourner le tracking.","en":"Promote the real books and their contents. Do not promise medical, financial or supernatural outcomes as commercial guarantees. Never hide the religious nature of a product or reroute tracking to bypass platform restrictions."}},{"id":"measure","kicker":"04","title":{"he":"מדידה ושיוך המכירות","fr":"Mesure et attribution","en":"Measurement and attribution"},"intro":{"he":"הזמנות ששולמו והחזרים בשופיפיי הם מקור האמת הכספי. מתחילים בדיווח הזמנות פנימי שמכבד הסכמה. פיקסל אפליקציה אינו מוכיח מדידה מותרת או מלאה. [12]","fr":"Commandes payées et remboursements Shopify = source de vérité. Commencer par un reporting first-party respectueux du consentement. La présence d’un pixel d’app ne prouve ni licéité ni complétude. [12]","en":"Shopify paid-order and refund records are the financial source of truth. Begin with consent-respecting first-party order reporting. App pixels do not establish lawful or complete measurement. [12]"},"rows":[{"k":{"he":"מוצר → עגלה → תשלום","fr":"Produit → panier → checkout","en":"Product → cart → checkout"},"v":{"he":"אירועי אבחון רק כאשר מותרים; אינם הכנסה.","fr":"Événements diagnostiques seulement si permis ; ce n’est pas du revenu.","en":"Diagnostic events only where permitted; not revenue."}},{"k":{"he":"הזמנה ששולמה","fr":"Commande payée","en":"Paid order"},"v":{"he":"מזהה הזמנה ייחודי, הכנסה נטו, שיוך מאושר לקמפיין.","fr":"ID unique, CA net capté, attribution campagne approuvée.","en":"Unique order ID, captured net sales, approved campaign attribution."}},{"k":{"he":"נמסר / הוחזר","fr":"Livré / remboursé","en":"Delivered / refunded"},"v":{"he":"התאמת עלויות אספקה, החזרים, ביטולים וחיובים חוזרים.","fr":"Coût d’exécution, remboursements, annulations, chargebacks.","en":"Fulfilment cost, refunds, cancellations and chargebacks reconciled."}},{"k":{"he":"תרומה","fr":"Contribution","en":"Contribution"},"v":{"he":"תקבולים נטו פחות עלויות משתנות מוסכמות, ואז כל מדיית הבדיקה ודמי הבסיס.","fr":"Recettes nettes moins coûts variables convenus, puis tout le média du pilote et les honoraires fixes.","en":"Net receipts minus agreed variable costs, then all pilot media and fixed fees."}}],"note":{"he":"מכירה זכאית: הזמנה מקוונת ראשונה ששולמה בידי לקוח חדש, עם לחיצה מתועדת מקמפיין לא־מותג מאושר בשבעת הימים שלפני ההזמנה, כשהקמפיין הוא המגע האחרון שאינו ישיר. מניעת כפילות לפי מזהה שופיפיי. מוחרגים: לקוחות חוזרים, חיפוש מותג, אורגני או ישיר בלבד, תרומות, סיטונאות ומכירות חנות אלא אם הוסכם בכתב. בלי שיוך — אין משתנה. שיוך הוא כלל חשבונאי מוסכם, לא הוכחת סיבתיות. לא מעלים רשימות לקוחות לפי דת. אם מטא חוסם אירועים — מכבדים את החסימה, בלי עקיפת CAPI. [8,9]","fr":"Vente éligible : première commande en ligne payée d’un nouveau client, clic tracé d’une campagne non-marque whitelistée dans les 7 jours, dernier touch non direct. Déduplication ID Shopify. Exclus : récurrents, brand, organique/direct seuls, dons, gros, magasin sauf accord. Sans attribution = pas de variable. Si Meta bloque, respecter le bloc — pas de contournement CAPI.","en":"Eligible pilot sale: a first paid online order from a new customer, with a recorded click from a whitelisted non-brand campaign within seven days and that campaign as the last non-direct touch. Deduplicate by Shopify order ID. Exclude repeats, brand search, organic/direct-only, donations, wholesale and in-store unless agreed. Missing attribution means no variable. Attribution is an agreed accounting rule, not proof of incrementality. If Meta blocks events, respect the block — not a CAPI workaround."}},{"id":"scenarios","kicker":"05","title":{"he":"הכלכלה לפני ההבטחות","fr":"L’économie avant les promesses","en":"The economics before promises"},"intro":{"he":"להמחשה בלבד: הזמנה ממוצעת 200 ₪ ללא מע״מ; תרומה אחרי מוצר, סליקה, אריזה ומשלוח 40% = 80 ₪. מדיה 1,500 ודמי בסיס 1,000. הערכים האמיתיים חייבים להגיע מהחנות. יחס הכנסה לפרסום לבדו אינו מספיק.","fr":"Illustration : panier 200 ₪ HT ; contribution 40 % = 80 ₪. Média 1 500 + base 1 000. Les vrais chiffres viennent de la boutique. Un ROAS chiffre d’affaires ne suffit pas.","en":"Illustration only: average order 200 ILS excluding VAT; contribution after product, payment, packing and delivery is 40%, or 80 ILS. Monthly media 1,500 and fixed fee 1,000. Actual values must come from the store. A revenue ROAS alone is insufficient."},"table":{"cols":{"he":["תרחיש","חלש","סביב איזון","חזק יותר"],"fr":["Scénario","Faible","Autour de l’équilibre","Plus fort"],"en":["Scenario","Weak","Break-even vicinity","Stronger"]},"rows":{"he":[["עלות רכישה ממדיה","75 ₪","50 ₪","30 ₪"],["הזמנות זכאיות","20","30","50"],["מכירות נטו","4,000 ₪","6,000 ₪","10,000 ₪"],["תרומה לפני שיווק","1,600 ₪","2,400 ₪","4,000 ₪"],["לאחר מדיה ובסיס","‎-900 ₪","‎-100 ₪","1,500 ₪"],["משתנה 15%","0 ₪","0 ₪","225 ₪"],["תוצאה ללקוח אחרי משתנה","‎-900 ₪","‎-100 ₪","1,275 ₪"]],"fr":[["Coût d’acquisition payant","75 ₪","50 ₪","30 ₪"],["Commandes éligibles","20","30","50"],["CA net","4 000 ₪","6 000 ₪","10 000 ₪"],["Contribution avant marketing","1 600 ₪","2 400 ₪","4 000 ₪"],["Après média + base","−900 ₪","−100 ₪","1 500 ₪"],["Variable 15 %","0 ₪","0 ₪","225 ₪"],["Résultat client après variable","−900 ₪","−100 ₪","1 275 ₪"]],"en":[["Paid acquisition cost","75 ₪","50 ₪","30 ₪"],["Eligible orders","20","30","50"],["Net sales","4,000 ₪","6,000 ₪","10,000 ₪"],["Contribution before marketing","1,600 ₪","2,400 ₪","4,000 ₪"],["After media + base","−900 ₪","−100 ₪","1,500 ₪"],["15% variable","0 ₪","0 ₪","225 ₪"],["Client result after variable","−900 ₪","−100 ₪","1,275 ₪"]]}},"note":{"he":"ב־40% תרומה, מכירות נטו לאיזון = (1,500+1,000)/0.40 = 6,250 ₪, כ־32 הזמנות ב־200 ₪ נטו. CPA מותר ממדיה ≈ 48.75 ₪. לא כלולים תקורות חנות ומס הכנסה. גם עלייה במכירות עלולה לייצר הפסד.","fr":"À 40 % de contribution, le CA net d’équilibre = 6 250 ₪, ≈ 32 commandes à 200 ₪. CPA média admissible ≈ 48,75 ₪. Hors overhead magasin et impôt. Plus de ventes peuvent encore produire une perte.","en":"At 40% contribution, monthly break-even net sales are (1,500 + 1,000) / 0.40 = 6,250 ILS, about 32 orders at 200 ILS net. Allowable paid CPA ≈ 48.75 ILS. This excludes unrelated store overhead and income tax. More sales can still produce a loss."}},{"id":"offers","kicker":"06","title":{"he":"פיילוט וחלופה","fr":"Pilote et alternative","en":"Pilot and alternative"},"intro":{"he":"1,000 ₪ לחודש + 15% מהתוצאה החיובית הזכאית. דמי הבסיס משולמים גם בלי תוצאה חיובית. אין דמי הקמה בהיקף המוגדר. המדיה בכרטיס הלקוח, תקרה 1,000–1,500 ₪. 15% הוא בחירה מסחרית, לא סטנדרט שוק. P = תרומה זכאית − כל מדיית הבדיקה − דמי הבסיס. משתנה = 15% × max(0,P). הפסדים נגררים בתוך הפיילוט. הזמנה חייבת להיות מסופקת ובת 30 יום לפחות לפני התחשבנות זמנית; סגירה סופית 60 יום מתום הבדיקה.","fr":"1 000 ₪ / mois + 15 % du résultat éligible positif. La base est due même sans résultat positif. Pas de frais de setup dans le périmètre. Média 1 000–1 500 ₪ sur la carte client. P = contribution éligible − média du pilote − honoraires. Variable = 15 % × max(0,P). Pertes reportées dans le pilote. Commande livrée et ≥ 30 jours avant règlement provisoire ; clôture 60 jours après le pilote.","en":"1,000 ILS per month + 15% of positive eligible result. The fixed fee is payable even when there is no positive result. No setup fee within the defined pilot. Media paid by the client, 1,000–1,500 ILS cap. The 15% is a commercial choice, not a claimed market standard. P = eligible contribution − total pilot media − fixed fees. Earned variable = 15% × max(0, P). Losses carry within the pilot. Orders must be fulfilled and at least 30 days old before provisional settlement; final true-up 60 days after the pilot."},"plans":[{"id":"pilot","fee":1000,"media":"1,000–1,500","extra":{"he":"+ 15% מהתוצאה החיובית הזכאית P","fr":"+ 15 % du résultat éligible positif P","en":"+ 15% of positive eligible result P"},"tone":"wine","recommended":true,"name":{"he":"פיילוט 90 יום","fr":"Pilote 90 jours","en":"90-day pilot"},"tag":{"he":"בסיס נמוך · משתנה רק אחרי תוצאה חיובית","fr":"Base basse · variable seulement si P > 0","en":"Low base · variable only if P > 0"},"includes":[{"he":"הקמה עד 5 שעות: גישה, טבלת עלויות ושיוך, מדידה מותרת, תגיות לבית+קטגוריה+3 מוצרים, התאמה בעמוד קיים","fr":"Setup ≤ 5 h : accès, ledger coûts/attribution, mesure permise, métas accueil+collection+3 produits, un ajustement de page","en":"Setup up to 5 hours: access, cost/attribution ledger, permitted measurement, homepage+collection+3 product tags, one existing-page adjustment"},{"he":"ערוץ ממומן אחד בכל פעם עד 1,500 ₪ מדיה, בקרה שבועית","fr":"Une plateforme payante à la fois, média ≤ 1 500 ₪, revue hebdo","en":"One paid platform at a time, media up to 1,500 ILS, weekly checks"},{"he":"2 סרטונים 15–30 שנ׳ מחומר שסופק + 2 סטטיות, התאמות פורמט, סבב תיקון אחד","fr":"2 montages 15–30 s + 2 statiques, adaptations, 1 révision","en":"Two 15–30s edits from supplied footage + two stills, format adaptations, one revision"},{"he":"תזמון אורגני באינסטגרם ובטיקטוק כשכלי החשבון מאפשרים — בלי ניהול קהילה יומי","fr":"Publication organique IG/TikTok si les outils le permettent ; pas de community management quotidien","en":"Schedule approved assets on Instagram and TikTok where tools allow; no daily community management"},{"he":"דוח תרומה חודשי + שיחת 30 דק׳. עד 6 שעות שירות בחודש","fr":"Réconciliation mensuelle + appel 30 min. Jusqu’à 6 h de service / mois","en":"Monthly contribution report + 30-minute review. Up to six service hours monthly"},{"he":"טיקטוק ממומן אינו כלול; מטא כפוף לזכאות ולמגבלות החשבון","fr":"TikTok payant non inclus ; Meta soumis à éligibilité","en":"Paid TikTok is not included; Meta ads and measurement are subject to account eligibility"}]},{"id":"fixed","fee":1800,"media":"1,000–1,500","extra":{"he":"בלי משתנה — רק אם נבחר בכתב","fr":"Sans variable — seulement si choisi par écrit","en":"No variable — only if chosen in writing"},"tone":"navy","name":{"he":"חלופה קבועה","fr":"Alternative fixe","en":"Fixed alternative"},"tag":{"he":"אותו היקף · בלי התחשבנות רווח","fr":"Même périmètre · sans réconciliation de profit","en":"Same scope · no profit recon"},"includes":[{"he":"אותו היקף שירות מצומצם כמו הפיילוט","fr":"Même périmètre de service limité que le pilote","en":"The same limited service scope as the pilot"},{"he":"1,800 ₪ קבועים לחודש, בלי רכיב משתנה","fr":"1 800 ₪ fixes / mois, sans variable","en":"1,800 ILS fixed per month, no variable"},{"he":"מדיה נפרדת בכרטיס הלקוח","fr":"Média à part, carte client","en":"Separate media on the client card"},{"he":"אופציה בלבד — לא שינוי אוטומטי","fr":"Option seulement — pas un basculement automatique","en":"Optional, not an automatic change"}]}],"note":{"he":"דוגמה חשבונאית, לא תחזית: 10,000 מכירות זכאיות נטו − 6,000 עלויות משתנות − 1,500 מדיה − 1,000 בסיס = 1,500. המשתנה 225; העסק שומר 1,275 לפני תקורות va: בסיס 1,000 → 1,180; עם 1,500 מדיה מדובר בלפחות 2,680 ₪ מזומן לפני מסי מדיה, משתנה ותוכנות. גם הרכיב המשתנה כפוף למסים החלים. מעמד המס יובהר בהזמנה. [19]","fr":"Si TVA israélienne 18 % : la base 1 000 devient 1 180 ; avec 1 500 de média, au moins 2 680 ₪ cash avant taxes média, variable et logiciels. Statut fiscal à confirmer. [19]","en":"If Israeli VAT at 18% applies: the 1,000 base becomes 1,180; with 1,500 media that is at least 2,680 ILS cash before media taxes, variable fees and optional software. Tax status must be confirmed. [19]"}},{"id":"terms","kicker":"08","title":{"he":"תנאים","fr":"Conditions","en":"Terms"},"intro":{"he":"פיילוט 90 יום, חיוב חודשי, בלי התחייבות שנתית. סיום בסוף חודש ששולם בהודעה של שבעה ימים. אין הבטחת הכנסה, רווח, אישור מודעה או דירוג. בתוקף עד 30.09.2026, כפוף לזיהוי העסקים ואישור היקף, עלויות, שיוך ותקציב בכתב. קבלת המסמך אינה הרשאה להפעלת קמפיין. הוכן לעיון, לא נשלח ולא נחתם.","fr":"Pilote 90 jours, mensuel, sans lock annuel. Fin en fin de mois payé, préavis 7 jours. Pas de garantie de CA, profit, validation pub ou ranking. Valable jusqu’au 30.09.2026. Accepter le document n’autorise pas le lancement d’une campagne. Préparé pour examen, non envoyé.","en":"A 90-day pilot is recommended, monthly billing, no annual commitment. Either party may end at the end of the paid month with seven days’ notice. No guaranteed revenue, profit, ad approval or search ranking. Valid through 30 September 2026. Accepting this document does not authorise campaign launch. Prepared for review, not sent or signed."},"note":{"he":"DreamNova.studio · David Amor, Senior Project Manager · 0584921492. הגרסאות באנגלית ובעברית כוללות אותם ממצאים, היקף ותנאים.","fr":"DreamNova.studio · David Amor, Senior Project Manager · 0584921492. Les éditions EN et HE portent les mêmes constats, le même périmètre et les mêmes termes.","en":"DreamNova.studio · David Amor, Senior Project Manager · 0584921492. English and Hebrew editions contain the same findings, scope and commercial terms."}}]};
const D = window.DN;
let lang = "he";
const $ = (id) => document.getElementById(id);
function t(map){ if(!map) return ""; if(typeof map==="string") return map; return map[lang] || map.he || ""; }
function el(html){ const d=document.createElement("div"); d.innerHTML=html; return d.innerHTML; }
function table(cols, rows){
  return '<div class="table-wrap"><table><thead><tr>'+cols.map(c=>"<th>"+esc(c)+"</th>").join("")+'</tr></thead><tbody>'+
    rows.map(r=>"<tr>"+r.map(c=>"<td>"+esc(String(c))+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(ch){ if(ch==="&") return String.fromCharCode(38)+"amp;"; if(ch==="<") return String.fromCharCode(38)+"lt;"; if(ch===">") return String.fromCharCode(38)+"gt;"; if(ch==='"') return String.fromCharCode(38)+"quot;"; return String.fromCharCode(38)+"#39;"; }); }
function cards(items){
  return '<div class="grid grid-3">'+items.map(p=>{
    const rec = p.recommended ? '<span class="tag">'+esc(t(D.ui.recommended))+'</span>' : "";
    const extra = p.extra ? '<p style="color:var(--wine);font-size:.85rem">'+esc(t(p.extra))+'</p>' : "";
    const total = p.total ? '<p class="muted"><b>'+esc(p.total)+' ₪</b> '+esc(t(D.ui.ht))+'</p>' : "";
    return '<article class="card"><div class="bar"></div><div class="pad"><div style="display:flex;justify-content:space-between;gap:.5rem"><div><p class="display" style="font-size:1.2rem;margin:0">'+esc(t(p.name))+'</p><p class="muted">'+esc(t(p.tag))+'</p></div>'+rec+'</div><p class="price display">'+Number(p.fee).toLocaleString("he-IL")+' ₪</p><p class="muted">'+esc(t(D.ui.month))+'</p><p class="muted">'+esc(t(D.ui.plusMedia))+' · '+esc(p.media)+' ₪</p>'+extra+total+'<ul class="inc">'+(p.includes||[]).map(i=>"<li>"+esc(t(i))+"</li>").join("")+"</ul></div></article>";
  }).join("")+"</div>";
}
function photos(){
  if(!D.photos||!D.photos.length) return "";
  return '<p class="muted">'+esc(t(D.photoCaption))+'</p><div class="grid grid-3">'+D.photos.map(p=>'<figure class="card"><img src="'+esc(p.src)+'" alt="'+esc(p.alt)+'"/></figure>').join("")+"</div>";
}
function render(){
  document.documentElement.lang = lang==="he"?"he":lang;
  document.documentElement.dir = lang==="he"?"rtl":"ltr";
  $("review").textContent = t(D.ui.review);
  $("forwhom").textContent = t(D.meta.forWhom);
  $("devis").textContent = D.meta.devis;
  document.querySelector("[data-owner]").textContent = D.meta.owner;
  $("sub").textContent = D.sub[lang] || D.sub.he;
  $("h1").textContent = D.meta.client;
  $("hero").textContent = t(D.hero);
  $("lead").textContent = t(D.lead);
  $("nav").innerHTML = D.nav.map(n=>'<a href="#'+n.id+'">'+esc(t(n.label))+'</a>').join("");
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang));
  let html = "";
  for (const s of D.sections){
    html += '<section id="'+s.id+'"><p class="kicker">'+esc(s.kicker)+'</p><h2>'+esc(t(s.title))+'</h2>';
    if(s.intro) html += '<p class="prose">'+esc(t(s.intro))+'</p>';
    if(s.callout) html += '<p class="callout" style="margin-top:1rem">'+esc(t(s.callout))+'</p>';
    if(s.kind==="photos") html += photos();
    if(s.table) html += table(s.table.cols[lang]||s.table.cols.he, (s.table.rows[lang]||s.table.rows.he||s.table.rows));
    if(s.rows) html += '<div class="grid grid-2" style="margin-top:1rem">'+s.rows.map(r=>'<div class="card pad"><p class="display" style="margin:0 0 .35rem">'+esc(t(r.k))+'</p><p class="muted">'+esc(t(r.v))+'</p></div>').join("")+"</div>";
    if(s.geo) html += '<div class="grid grid-2" style="margin-top:1rem">'+s.geo.map(g=>'<div class="card pad"><p class="muted">'+esc(g.id)+'</p><p class="display" style="margin:.2rem 0">'+esc(t(g.name))+'</p><p class="muted">'+esc(t(g.who))+'</p></div>').join("")+"</div>";
    if(s.plans) html += cards(s.plans);
    if(s.note) html += '<p class="prose muted">'+esc(t(s.note))+'</p>';
    if(s.html) html += s.html;
    html += "</section>";
  }
  $("app").innerHTML = html;
  $("contact").innerHTML = '<div class="box"><div><p class="display" style="margin:0;font-size:1.15rem">'+esc(D.agency.name)+'</p><p style="opacity:.85">'+esc(D.agency.person)+" · "+esc(D.agency.role)+" · "+esc(D.agency.phone)+'</p><p style="opacity:.7;font-size:.8rem">'+esc(D.meta.devis)+" · "+esc(t(D.ui.valid))+'</p></div><div><a class="btn" href="'+D.agency.wa+'" target="_blank" rel="noreferrer">WhatsApp</a></div></div>';
  $("foot").textContent = D.footer[lang] || D.footer.he;
}
document.getElementById("langs").addEventListener("click", (e)=>{
  const b=e.target.closest("button[data-lang]"); if(!b) return; lang=b.dataset.lang; render();
});
render();
</script>
</body></html>
